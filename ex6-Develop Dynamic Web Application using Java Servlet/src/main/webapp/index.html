<!DOCTYPE html>
<html>

<head>

    <title>Student Examination Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Student Examination Result</h1>

        <form action="ResultServlet" method="post">

            <label>Register Number</label>
            <input type="text" name="regno" required>

            <label>Student Name</label>
            <input type="text" name="name" required>

            <label>Department</label>
            <select name="department" required>
                <option value="">Select Department</option>
                <option value="CSE">Computer Science Engineering</option>
                <option value="ECE">Electronics and Communication Engineering</option>
                <option value="EEE">Electrical and Electronics Engineering</option>
                <option value="MECH">Mechanical Engineering</option>
                <option value="CIVIL">Civil Engineering</option>
            </select>

            <label>Subject 1 Mark</label>
            <input type="number" name="mark1" min="0" max="100" required>

            <label>Subject 2 Mark</label>
            <input type="number" name="mark2" min="0" max="100" required>

            <label>Subject 3 Mark</label>
            <input type="number" name="mark3" min="0" max="100" required>

            <label>Subject 4 Mark</label>
            <input type="number" name="mark4" min="0" max="100" required>

            <label>Subject 5 Mark</label>
            <input type="number" name="mark5" min="0" max="100" required>

            <label>Attendance Percentage</label>
            <input type="number"
                   name="attendance"
                   min="0"
                   max="100"
                   step="0.01"
                   required>

            <input type="submit" value="Calculate Result">

        </form>

    </div>

</body>

</html>
